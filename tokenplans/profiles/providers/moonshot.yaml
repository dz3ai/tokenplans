name: Moonshot
slug: moonshot
endpoints:
  - id: openai
    name: OpenAI-compatible
    api_type: openai
    base_url: https://api.moonshot.cn/v1
    auth: bearer
    models:
      - id: kimi-k2-0711-preview
        in: 4.0
        out: 16.0
        capabilities: [coding, research, chat]
      - id: moonshot-v1-8k
        in: 12.0
        out: 12.0
        capabilities: [chat, research]
balance:
  endpoint: openai
  path: /users/me/balance
  response_path: data.available_balance
  unit: CNY
